[project]
name = "axiomq-workers"
version = "0.1.0"
description = "AxiomQ background workers (Dramatiq over Redis)."
requires-python = ">=3.11"
dependencies = [
    "axiomq-api",
    "dramatiq[redis,watch]>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiomq_workers"]
