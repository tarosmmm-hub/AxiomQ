[project]
name = "axiomq"
version = "0.1.0"
description = "AxiomQ monorepo (Python workspace root)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["quant_engine", "backend", "workers"]

[tool.uv.sources]
axiomq-quant-engine = { workspace = true }
axiomq-api = { workspace = true }
axiomq-workers = { workspace = true }

[dependency-groups]
dev = [
    "axiomq-quant-engine",
    "axiomq-api",
    "axiomq-workers",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "DTZ", "PT", "N"]
ignore = ["S101", "B008", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["axiomq_api", "axiomq_workers", "quant_engine", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "SIM300"]
"**/migrations/**" = ["E501"]
"backend/src/axiomq_api/modules/audit/service.py" = ["S105"]  # audit action names contain "password"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["quant_engine/src", "backend/src", "workers/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["dramatiq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL (and Redis where noted)",
]

[tool.importlinter]
root_packages = ["quant_engine", "axiomq_api", "axiomq_workers"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "quant_engine is a pure library (no backend, web, db or queue deps)"
type = "forbidden"
source_modules = ["quant_engine"]
forbidden_modules = ["axiomq_api", "axiomq_workers", "fastapi", "sqlalchemy", "redis", "dramatiq", "alembic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "backend does not depend on workers; only the queue adapter knows Dramatiq"
type = "forbidden"
source_modules = ["axiomq_api"]
forbidden_modules = ["axiomq_workers", "dramatiq"]
ignore_imports = ["axiomq_api.jobs.dramatiq_queue -> dramatiq"]
