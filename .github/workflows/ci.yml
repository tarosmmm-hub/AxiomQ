name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python (lint, types, contracts, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axiomq
          POSTGRES_PASSWORD: axiomq
          POSTGRES_DB: axiomq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiomq" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AXIOMQ_TEST_DATABASE_URL: postgresql+psycopg://axiomq:axiomq@localhost:5432/axiomq_test
      AXIOMQ_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend/src quant_engine/src workers/src
      - run: uv run lint-imports
      - run: uv run pytest backend/tests quant_engine/tests workers/tests --cov=axiomq_api --cov=quant_engine --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, build, API contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm format:check
        working-directory: frontend
      - name: Generated API client is up to date
        run: make api-client-check
      - run: pnpm build
        working-directory: frontend

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axiomq
          POSTGRES_PASSWORD: axiomq
          POSTGRES_DB: axiomq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiomq" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_ADMIN_URL: postgresql://axiomq:axiomq@localhost:5432/axiomq
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/python.Dockerfile --target runtime -t axiomq-python:ci .
      - run: docker build -f infra/docker/frontend.Dockerfile --target runtime -t axiomq-web:ci .
