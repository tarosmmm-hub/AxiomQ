[project]
name = "axiomq-quant-engine"
version = "0.1.0"
description = "AxiomQ quantitative engine: pure, deterministic library (no web/db dependencies)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_engine"]
